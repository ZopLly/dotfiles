<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панели рабочего стола — макет</title><style>
*{box-sizing:border-box}body{margin:0;color:#edf0f7;font:15px system-ui;background:radial-gradient(ellipse at 75% 80%,#62727e,transparent 60%),linear-gradient(140deg,#172531,#3c505f);height:100vh;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0}.island{position:absolute;top:14px;background:#18212bef;border:1px solid #ffffff20;border-radius:25px;overflow:hidden;box-shadow:0 15px 45px #0003;width:var(--small);transition:width .32s ease,height .32s ease;height:44px}.island.open{width:var(--large);height:var(--height)}.left{left:18px;--small:160px;--large:330px;--height:330px}.center{left:50%;transform:translateX(-50%);--small:190px;--large:370px;--height:445px}.right{right:18px;--small:240px;--large:370px;--height:410px}.handle{background:none;width:100%;height:43px;white-space:nowrap;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.body{padding:18px 22px;opacity:0;transform:translateY(-10px);transition:.25s;visibility:hidden}.open .body{opacity:1;transform:none;visibility:visible;transition-delay:.08s}h1{font-size:55px;font-weight:400;margin:0}h2{font-size:17px;margin:0 0 14px}.muted{color:#a9b5c5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#ffffff0c;border-radius:18px;padding:15px;text-align:left}.tile.active{background:#a9c9ea;color:#172531}.tile small{display:block;margin-top:7px;opacity:.7}.row{margin:17px 0}input{width:100%;accent-color:#a9c9ea}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;margin-top:16px}.calendar span{padding:6px 0}.today{background:#a9c9ea;color:#172531;border-radius:50%}.desktop{position:absolute;left:9%;bottom:18%;pointer-events:none}.desktop h1{font-size:80px;letter-spacing:-3px}.hint{position:absolute;bottom:25px;left:0;width:100%;text-align:center;color:#d9e2eb;font-size:13px}.music{border-radius:18px;background:linear-gradient(135deg,#748ca3,#39495e);height:110px;display:grid;place-items:center;font-size:40px;margin-bottom:15px}.controls{display:flex;justify-content:center;gap:25px;margin-top:20px}.controls button{background:none;font-size:22px}@media(max-width:950px){.island{transform:scale(.8);transform-origin:top left}.center{left:35%;transform:scale(.8)}.right{right:10px;transform-origin:top right}.desktop h1{font-size:50px}}
</style><div class="desktop"><h1 id="deskclock"></h1><p class="muted">Меньше шума. Всё нужное — сверху.</p></div>
<section class="island left"><button class="handle" aria-expanded="false"><span>◉ &nbsp; Музыка</span><span>♫</span></button><div class="body"><div class="music">♫</div><h2>Название трека</h2><div class="muted">Исполнитель · демонстрация</div><div class="controls"><button>⏮</button><button onclick="this.textContent=this.textContent==='▶'?'Ⅱ':'▶'">▶</button><button>⏭</button></div></div></section>
<section class="island center"><button class="handle" aria-expanded="false"><span id="barclock"></span><span>▦</span></button><div class="body"><h1 id="clock"></h1><p id="date" class="muted"></p><div id="calendar" class="calendar"></div></div></section>
<section class="island right"><button class="handle" aria-expanded="false"><span>⌁ &nbsp; VPN &nbsp; ◉</span><span>82% ▰</span></button><div class="body"><h2>Управление</h2><div class="grid"><button class="tile active">Wi-Fi<small>Домашняя сеть</small></button><button class="tile">VPN<small>Отключён</small></button><button class="tile active">Bluetooth<small>Включён</small></button><button class="tile">Не беспокоить<small>Выключено</small></button></div><div class="row">Громкость <input aria-label="Громкость" type="range" value="45"></div><div class="row">Яркость <input aria-label="Яркость" type="range" value="70"></div><div class="muted">Батарея 82% · Сбалансированный режим</div></div></section>
<div class="hint">Нажми на островок · Esc или клик по фону закрывает панели · Это макет, системные настройки он не меняет</div>
<script>
const panels=[...document.querySelectorAll('.island')];function close(){panels.forEach(p=>{p.classList.remove('open');p.querySelector('.handle').setAttribute('aria-expanded','false')})}panels.forEach(p=>p.querySelector('.handle').onclick=()=>{const opening=!p.classList.contains('open');close();p.classList.toggle('open',opening);p.querySelector('.handle').setAttribute('aria-expanded',String(opening))});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.addEventListener('click',e=>{if(!e.target.closest('.island'))close()});document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>t.classList.toggle('active'));const now=new Date();const time=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});['clock','deskclock'].forEach(id=>document.getElementById(id).textContent=time);document.getElementById('barclock').textContent=time+' · '+now.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});document.getElementById('date').textContent=now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});const cal=document.getElementById('calendar');['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>cal.insertAdjacentHTML('beforeend','<span class="muted">'+d+'</span>'));const offset=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;for(let i=0;i<offset;i++)cal.appendChild(document.createElement('span'));for(let i=1;i<=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();i++){const s=document.createElement('span');s.textContent=i;if(i===now.getDate())s.className='today';cal.appendChild(s)}
</script></html>
